version: '3.8'

services:
  rpa-engine:
    build: .
    container_name: rpa-automation-tool
    ports:
      - "8000:8000"
    volumes:
      - ./flows:/app/flows
      - ./output:/app/output
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
